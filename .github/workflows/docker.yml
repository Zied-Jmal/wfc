name: Docker Build

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - context: Commander_Repo
            dockerfile: Commander_Repo/Dockerfile
            image: wfc-commander
          - context: Swarm_Repo
            dockerfile: Swarm_Repo/Dockerfile.leader
            image: wfc-swarm-leader
          - context: Swarm_Repo
            dockerfile: Swarm_Repo/Dockerfile.scout
            image: wfc-swarm-scout
          - context: Swarm_Repo
            dockerfile: Swarm_Repo/Dockerfile.fighter
            image: wfc-swarm-fighter
          - context: Dashboard_Repo
            dockerfile: Dashboard_Repo/Dockerfile
            image: wfc-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
