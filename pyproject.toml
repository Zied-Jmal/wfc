[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument (FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["wfc_shared", "dashboard", "core", "command_nodes"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = [
    "Commander_Repo/tests",
    "Swarm_Repo/tests",
    "Dashboard_Repo/tests",
    "tests",
]
markers = [
    "unit: unit tests",
    "component: component tests",
    "repo_integration: requires Docker",
    "system_integration: requires all services",
]
